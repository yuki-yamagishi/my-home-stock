name: "✨ 新機能・機能拡張 (Feature)"
description: 新しい機能や機能拡張を提案・開発するための Issue
labels: ["type: feature", "status: backlog"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ 新機能提案
        機能の概要、受け入れ基準、技術論点を具体的に記入してください。
  - type: textarea
    id: overview
    attributes:
      label: 1. 概要 (Overview)
      description: どのような機能を追加するか、簡潔に記載してください。
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 2. 受け入れ基準 (Acceptance Criteria)
      description: 完了条件をチェックボックス形式で記載してください。
      value: |
        - [ ] 
        - [ ] 既存のテストが全件 PASS すること (`npm run check`)
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: 3. 技術的論点・設計方針 (Technical Notes)
      description: 関連するバックエンド API、DB スキーマ変更、ADR 作成の要否などを記載してください。
