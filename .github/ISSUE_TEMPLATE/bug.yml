name: "🐛 不具合・バグ報告 (Bug)"
description: 既存機能の不具合やエラーを修正するための Issue
labels: ["type: bug", "status: backlog"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 バグ報告
        再現手順、期待される動作、実際のエラー内容を記載してください。
  - type: textarea
    id: description
    attributes:
      label: 1. 現象・エラー内容
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 2. 再現手順
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 3. 期待される動作
    validations:
      required: true
