name: MyHomeStock Continuous Deployment (OCI / GHCR)

on:
  push:
    branches: [master, main]

# Concurrency control to prevent race conditions during consecutive pushes
concurrency:
  group: cd-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci-verification:
    name: CI Quality Gate Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Quality Gate & Document Integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Quality Gate Guards
        run: node .agents/plugins/myhomestock/hooks/qualityGateRunner.js

      # 2. Backend Tests
      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
      - name: Run Backend Tests
        run: ./mvnw test

      # 3. Frontend Quality (TypeScript, Vitest, Build)
      - name: Frontend Quality Checks
        run: |
          cd frontend
          npm ci
          npm run type-check
          npm run test:run
          npm run build

  build-and-push:
    name: Native JAR Build & ARM64 Container Push to GHCR
    needs: [ci-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Fast native x86_64 Single JAR packaging (bundles Vite PWA into target/classes/static/)
      # Bypasses slow QEMU emulation for heavy Maven/npm build
      - name: Build Single JAR (Native x86_64)
        run: ./mvnw clean package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo_name.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Containerize pre-built Single JAR for ARM64 using lightweight Dockerfile.prod
      - name: Build and Push ARM64 Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-old-images:
    name: Registry Hygiene (Auto-purge old container versions)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Purge old container images (Keep latest and last 5 SHA versions)
        uses: actions/delete-package-versions@v5
        continue-on-error: true # Ensure workflow does not break on initial repository setup
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'
          ignore-versions: '^latest$'
