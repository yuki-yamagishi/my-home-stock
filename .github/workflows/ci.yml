name: MyHomeStock Quality & CI Gate

on:
  push:
    branches: [master, main, 'feature/**', 'fix/**']
  pull_request:
    branches: [master, main]

jobs:
  quality-gate:
    name: Security & Document Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MyHomeStock Quality Gate Guards
        run: node .agents/plugins/myhomestock/hooks/qualityGateRunner.js

  backend:
    name: Backend Build & Tests (Spring Boot 4 / Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
      - name: Run Backend Tests
        run: ./mvnw test

  frontend:
    name: Frontend Quality (TypeScript, Tests, PWA Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      - name: TypeScript Strict Type Check
        run: |
          cd frontend
          npm run type-check
      - name: Vitest Unit Tests
        run: |
          cd frontend
          npm run test:run
      - name: Vite PWA Production Build
        run: |
          cd frontend
          npm run build
