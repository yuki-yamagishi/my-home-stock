services:
  caddy:
    image: caddy:2-alpine
    container_name: myhomestock-caddy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: myhomestock-postgres
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      POSTGRES_DB: myhomestock
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Tokyo
    # In production, Postgres port 5432 is not exposed to host for maximum security
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d myhomestock"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/${IMAGE_REPO:-yuki-yamagishi/my-home-stock}:${IMAGE_TAG:-latest}
    container_name: myhomestock-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myhomestock
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: prod
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-google-client-secret}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    # In production, raw Spring Boot port 8080 is not exposed to host; routed via Caddy HTTPS reverse proxy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: myhomestock-watchtower
    restart: unless-stopped
    command: --interval 300 --label-enable --cleanup --include-restarting
    environment:
      DOCKER_API_VERSION: "1.44"
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_PAT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
